<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Interest Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="calculator-card">
            <h1>Simple Interest Calculator</h1>
            
            <div class="input-group">
                <label for="principal">Principal Amount</label>
                <input type="number" id="principal" placeholder="Enter principal amount">
            </div>

            <div class="input-group">
                <label for="rate">Interest Rate</label>
                <div class="range-container">
                    <input type="range" id="rate" min="1" max="20" value="10.25" step="0.25" onchange="updateRate()">
                    <span id="rate_val" class="rate-display">10.25%</span>
                </div>
            </div>

            <div class="input-group">
                <label for="years">Number of Years</label>
                <select id="years">
                    <option value="1">1 Year</option>
                    <option value="2">2 Years</option>
                    <option value="3">3 Years</option>
                    <option value="4">4 Years</option>
                    <option value="5">5 Years</option>
                    <option value="6">6 Years</option>
                    <option value="7">7 Years</option>
                    <option value="8">8 Years</option>
                    <option value="9">9 Years</option>
                    <option value="10">10 Years</option>
                </select>
            </div>

            <div class="result-group">
                <label>Calculated Interest:</label>
                <span id="result" class="result-display">-</span>
            </div>

            <button onclick="compute()" class="compute-btn">Calculate Interest</button>
        </div>
    </div>

    <footer>
        © 2025 This Calculator belongs to Illinois Familia
    </footer>

    <script src="script.js"></script>
</body>
</html>
